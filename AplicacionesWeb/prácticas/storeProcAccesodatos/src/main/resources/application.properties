# ---------- Identidad ----------
spring.application.name=storeProcAccesodatos

# ---------- DataSource (PostgreSQL 16) ----------
spring.datasource.url=jdbc:postgresql://localhost:5432/facturacion
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------- Pool HikariCP ----------
spring.datasource.hikari.pool-name=StoreProcHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=America/Guayaquil
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# ---------- Flyway ----------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/procs
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

# ---------- Servidor ----------
server.port=8080
server.error.include-message=always

# ---------- Logging ----------
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.springframework.jdbc.core=DEBUG
logging.level.org.flywaydb=INFO
