<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" font-family="system-ui, sans-serif">
    <title>Línea de tiempo: evolución de HTML 1991-2026</title>
    <desc>Hitos históricos del lenguaje HTML desde su creación por Tim Berners-Lee hasta el HTML Living Standard de 2026.</desc>

    <!-- Fondo -->
    <rect width="1200" height="500" fill="#FAFBF7"/>

    <!-- Título -->
    <text x="600" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#2C5F2D">
        35 años de HTML: 1991 → 2026
    </text>
    <text x="600" y="62" text-anchor="middle" font-size="13" fill="#666" font-style="italic">
        De documento académico al lenguaje de la web viva
    </text>

    <!-- Línea principal -->
    <line x1="80" y1="250" x2="1120" y2="250" stroke="#2C5F2D" stroke-width="4"/>

    <!-- HITO 1: 1991 -->
    <circle cx="120" cy="250" r="14" fill="#2C5F2D" stroke="white" stroke-width="3"/>
    <line x1="120" y1="250" x2="120" y2="160" stroke="#2C5F2D" stroke-width="2"/>
    <rect x="50" y="100" width="140" height="60" fill="white" stroke="#2C5F2D" stroke-width="2" rx="4"/>
    <text x="120" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C5F2D">1991</text>
    <text x="120" y="138" text-anchor="middle" font-size="10" fill="#333">Tim Berners-Lee</text>
    <text x="120" y="152" text-anchor="middle" font-size="10" fill="#333">crea HTML en CERN</text>

    <!-- HITO 2: 1995 HTML 2.0 -->
    <circle cx="240" cy="250" r="12" fill="#97BC62" stroke="white" stroke-width="3"/>
    <line x1="240" y1="250" x2="240" y2="320" stroke="#97BC62" stroke-width="2"/>
    <rect x="170" y="320" width="140" height="60" fill="white" stroke="#97BC62" stroke-width="2" rx="4"/>
    <text x="240" y="340" text-anchor="middle" font-size="14" font-weight="bold" fill="#7da348">1995</text>
    <text x="240" y="358" text-anchor="middle" font-size="10" fill="#333">HTML 2.0</text>
    <text x="240" y="372" text-anchor="middle" font-size="10" fill="#333">Primer estándar (IETF)</text>

    <!-- HITO 3: 1999 HTML 4.01 -->
    <circle cx="360" cy="250" r="12" fill="#D4A017" stroke="white" stroke-width="3"/>
    <line x1="360" y1="250" x2="360" y2="160" stroke="#D4A017" stroke-width="2"/>
    <rect x="290" y="100" width="140" height="60" fill="white" stroke="#D4A017" stroke-width="2" rx="4"/>
    <text x="360" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#a07c10">1999</text>
    <text x="360" y="138" text-anchor="middle" font-size="10" fill="#333">HTML 4.01</text>
    <text x="360" y="152" text-anchor="middle" font-size="10" fill="#333">El estándar de la web</text>

    <!-- HITO 4: 2000 XHTML -->
    <circle cx="480" cy="250" r="12" fill="#B85042" stroke="white" stroke-width="3"/>
    <line x1="480" y1="250" x2="480" y2="320" stroke="#B85042" stroke-width="2"/>
    <rect x="410" y="320" width="140" height="60" fill="white" stroke="#B85042" stroke-width="2" rx="4"/>
    <text x="480" y="340" text-anchor="middle" font-size="14" font-weight="bold" fill="#8b3c32">2000</text>
    <text x="480" y="358" text-anchor="middle" font-size="10" fill="#333">XHTML 1.0</text>
    <text x="480" y="372" text-anchor="middle" font-size="10" fill="#333">HTML reformulado en XML</text>

    <!-- HITO 5: 2008 HTML5 draft -->
    <circle cx="600" cy="250" r="14" fill="#2C5F2D" stroke="white" stroke-width="3"/>
    <line x1="600" y1="250" x2="600" y2="160" stroke="#2C5F2D" stroke-width="2"/>
    <rect x="525" y="100" width="150" height="60" fill="white" stroke="#2C5F2D" stroke-width="2" rx="4"/>
    <text x="600" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C5F2D">2008</text>
    <text x="600" y="138" text-anchor="middle" font-size="10" fill="#333">HTML5 First Draft</text>
    <text x="600" y="152" text-anchor="middle" font-size="10" fill="#333">WHATWG → semántica</text>

    <!-- HITO 6: 2014 HTML5 W3C -->
    <circle cx="720" cy="250" r="14" fill="#D4A017" stroke="white" stroke-width="3"/>
    <line x1="720" y1="250" x2="720" y2="320" stroke="#D4A017" stroke-width="2"/>
    <rect x="645" y="320" width="150" height="60" fill="white" stroke="#D4A017" stroke-width="2" rx="4"/>
    <text x="720" y="340" text-anchor="middle" font-size="14" font-weight="bold" fill="#a07c10">2014</text>
    <text x="720" y="358" text-anchor="middle" font-size="10" fill="#333">HTML5 Recomendación</text>
    <text x="720" y="372" text-anchor="middle" font-size="10" fill="#333">Oficial W3C</text>

    <!-- HITO 7: 2019 Living Standard -->
    <circle cx="840" cy="250" r="14" fill="#97BC62" stroke="white" stroke-width="3"/>
    <line x1="840" y1="250" x2="840" y2="160" stroke="#97BC62" stroke-width="2"/>
    <rect x="765" y="100" width="150" height="60" fill="white" stroke="#97BC62" stroke-width="2" rx="4"/>
    <text x="840" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#7da348">2019</text>
    <text x="840" y="138" text-anchor="middle" font-size="10" fill="#333">HTML Living Standard</text>
    <text x="840" y="152" text-anchor="middle" font-size="10" fill="#333">Sin versiones, evolución</text>

    <!-- HITO 8: 2026 Hoy -->
    <circle cx="1060" cy="250" r="16" fill="#2C5F2D" stroke="#D4A017" stroke-width="4"/>
    <line x1="1060" y1="250" x2="1060" y2="320" stroke="#2C5F2D" stroke-width="2"/>
    <rect x="985" y="320" width="150" height="60" fill="#2C5F2D" stroke="#1e4220" stroke-width="2" rx="4"/>
    <text x="1060" y="340" text-anchor="middle" font-size="14" font-weight="bold" fill="#D4A017">2026 — HOY</text>
    <text x="1060" y="358" text-anchor="middle" font-size="10" fill="white">100+ APIs nativas</text>
    <text x="1060" y="372" text-anchor="middle" font-size="10" fill="white">Web Components, AI APIs</text>

    <!-- Anotación inferior -->
    <text x="600" y="440" text-anchor="middle" font-size="13" fill="#2C5F2D" font-weight="bold">
        Lección clave: HTML ya no se "versiona" — evoluciona como organismo vivo.
    </text>
    <text x="600" y="460" text-anchor="middle" font-size="11" fill="#666" font-style="italic">
        El estudiante moderno aprende el estándar actual y se mantiene al día con caniuse.com
    </text>
</svg>
