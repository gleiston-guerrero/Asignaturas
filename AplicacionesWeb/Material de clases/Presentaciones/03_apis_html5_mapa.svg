<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="system-ui, sans-serif">
    <title>Las cinco APIs nativas de HTML5</title>
    <desc>Mapa conceptual que muestra las cinco APIs principales que introdujo HTML5: multimedia, canvas, geolocalización, web storage y drag-and-drop.</desc>

    <!-- Fondo -->
    <rect width="1000" height="700" fill="#FAFBF7"/>

    <!-- Título -->
    <text x="500" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#2C5F2D">
        Las 5 APIs nativas que cambiaron la web
    </text>
    <text x="500" y="62" text-anchor="middle" font-size="13" fill="#666" font-style="italic">
        HTML5 no es solo etiquetas: es un ecosistema de capacidades del navegador
    </text>

    <!-- Nodo central -->
    <circle cx="500" cy="370" r="80" fill="#2C5F2D" stroke="#D4A017" stroke-width="4"/>
    <text x="500" y="365" text-anchor="middle" font-size="22" font-weight="bold" fill="white">HTML5</text>
    <text x="500" y="390" text-anchor="middle" font-size="13" fill="#d4e8c4">APIs nativas</text>

    <!-- Líneas conectoras -->
    <line x1="500" y1="290" x2="200" y2="180" stroke="#97BC62" stroke-width="2"/>
    <line x1="500" y1="290" x2="800" y2="180" stroke="#97BC62" stroke-width="2"/>
    <line x1="420" y1="370" x2="100" y2="370" stroke="#97BC62" stroke-width="2"/>
    <line x1="580" y1="370" x2="900" y2="370" stroke="#97BC62" stroke-width="2"/>
    <line x1="500" y1="450" x2="500" y2="570" stroke="#97BC62" stroke-width="2"/>

    <!-- API 1: Multimedia (arriba-izquierda) -->
    <rect x="60" y="100" width="280" height="160" fill="white" stroke="#2C5F2D" stroke-width="2" rx="8"/>
    <circle cx="100" cy="140" r="22" fill="#2C5F2D"/>
    <text x="100" y="148" text-anchor="middle" font-size="22" fill="white">▶</text>
    <text x="140" y="135" font-size="16" font-weight="bold" fill="#2C5F2D">1. Multimedia</text>
    <text x="140" y="153" font-size="11" fill="#666" font-style="italic">&lt;video&gt; y &lt;audio&gt;</text>
    <text x="80" y="180" font-size="11" fill="#333">• Reproducción nativa sin plugins</text>
    <text x="80" y="200" font-size="11" fill="#333">• Múltiples fuentes y formatos</text>
    <text x="80" y="220" font-size="11" fill="#333">• Subtítulos con &lt;track&gt; (VTT)</text>
    <text x="80" y="240" font-size="11" fill="#333">• Control vía JavaScript</text>

    <!-- API 2: Canvas (arriba-derecha) -->
    <rect x="660" y="100" width="280" height="160" fill="white" stroke="#D4A017" stroke-width="2" rx="8"/>
    <circle cx="700" cy="140" r="22" fill="#D4A017"/>
    <text x="700" y="148" text-anchor="middle" font-size="22" fill="white">▦</text>
    <text x="740" y="135" font-size="16" font-weight="bold" fill="#a07c10">2. Canvas 2D / WebGL</text>
    <text x="740" y="153" font-size="11" fill="#666" font-style="italic">&lt;canvas&gt;</text>
    <text x="680" y="180" font-size="11" fill="#333">• Dibujo bitmap dinámico</text>
    <text x="680" y="200" font-size="11" fill="#333">• Juegos 2D / animaciones</text>
    <text x="680" y="220" font-size="11" fill="#333">• Gráficos 3D con WebGL</text>
    <text x="680" y="240" font-size="11" fill="#333">• Procesamiento de imagen</text>

    <!-- API 3: Geolocation (izquierda) -->
    <rect x="20" y="290" width="280" height="160" fill="white" stroke="#B85042" stroke-width="2" rx="8"/>
    <circle cx="60" cy="330" r="22" fill="#B85042"/>
    <text x="60" y="338" text-anchor="middle" font-size="20" fill="white">📍</text>
    <text x="100" y="325" font-size="16" font-weight="bold" fill="#8b3c32">3. Geolocation</text>
    <text x="100" y="343" font-size="11" fill="#666" font-style="italic">navigator.geolocation</text>
    <text x="40" y="370" font-size="11" fill="#333">• GPS / Wi-Fi / IP</text>
    <text x="40" y="390" font-size="11" fill="#333">• Coordenadas lat/lng</text>
    <text x="40" y="410" font-size="11" fill="#333">• Solo HTTPS + permiso</text>
    <text x="40" y="430" font-size="11" fill="#333">• Watch para tracking</text>

    <!-- API 4: Web Storage (derecha) -->
    <rect x="700" y="290" width="280" height="160" fill="white" stroke="#97BC62" stroke-width="2" rx="8"/>
    <circle cx="740" cy="330" r="22" fill="#7da348"/>
    <text x="740" y="338" text-anchor="middle" font-size="20" fill="white">💾</text>
    <text x="780" y="325" font-size="16" font-weight="bold" fill="#5d7d34">4. Web Storage</text>
    <text x="780" y="343" font-size="11" fill="#666" font-style="italic">localStorage / sessionStorage</text>
    <text x="720" y="370" font-size="11" fill="#333">• Pares clave/valor</text>
    <text x="720" y="390" font-size="11" fill="#333">• ~5-10 MB por origen</text>
    <text x="720" y="410" font-size="11" fill="#333">• NO usar para JWT/tokens</text>
    <text x="720" y="430" font-size="11" fill="#333">• IndexedDB para más datos</text>

    <!-- API 5: Drag and Drop (abajo) -->
    <rect x="360" y="570" width="280" height="110" fill="white" stroke="#666" stroke-width="2" rx="8"/>
    <circle cx="400" cy="615" r="22" fill="#444"/>
    <text x="400" y="623" text-anchor="middle" font-size="20" fill="white">✋</text>
    <text x="440" y="610" font-size="16" font-weight="bold" fill="#444">5. Drag &amp; Drop</text>
    <text x="440" y="628" font-size="11" fill="#666" font-style="italic">draggable + DataTransfer</text>
    <text x="380" y="655" font-size="11" fill="#333">• Reordenar listas</text>
    <text x="380" y="672" font-size="11" fill="#333">• Subir archivos al navegador</text>

    <!-- Nota inferior -->
    <text x="500" y="570" text-anchor="middle" font-size="11" fill="#2C5F2D" font-weight="bold">
        + WebRTC, Service Workers, Push, WebUSB, WebBluetooth, WebGPU…
    </text>
</svg>
