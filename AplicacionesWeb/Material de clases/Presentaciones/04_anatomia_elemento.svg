<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" font-family="Consolas, Monaco, monospace">
    <title>Anatomía de un elemento HTML</title>
    <desc>Diagrama anatómico que descompone un elemento HTML en sus partes: etiqueta de apertura, atributo, valor, contenido y etiqueta de cierre.</desc>

    <!-- Fondo -->
    <rect width="1000" height="480" fill="#FAFBF7"/>

    <!-- Título -->
    <text x="500" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#2C5F2D" font-family="system-ui">
        Anatomía de un elemento HTML
    </text>
    <text x="500" y="62" text-anchor="middle" font-size="12" fill="#666" font-style="italic" font-family="system-ui">
        Conoce las partes para hablar el idioma del estándar
    </text>

    <!-- Caja con el código -->
    <rect x="100" y="200" width="800" height="80" fill="#1E2D24" rx="6"/>

    <!-- El código: <a href="https://uteq.edu.ec">UTEQ</a> -->
    <text x="500" y="252" text-anchor="middle" font-size="34" font-weight="bold" font-family="Consolas, Monaco, monospace">
        <tspan fill="#97BC62">&lt;a</tspan>
        <tspan fill="white"> </tspan>
        <tspan fill="#D4A017">href</tspan>
        <tspan fill="white">=</tspan>
        <tspan fill="#FF9E64">"https://uteq.edu.ec"</tspan>
        <tspan fill="#97BC62">&gt;</tspan>
        <tspan fill="white">UTEQ</tspan>
        <tspan fill="#97BC62">&lt;/a&gt;</tspan>
    </text>

    <!-- ETIQUETA DE APERTURA -->
    <line x1="220" y1="200" x2="220" y2="130" stroke="#97BC62" stroke-width="2"/>
    <rect x="100" y="80" width="240" height="50" fill="#97BC62" rx="4"/>
    <text x="220" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#1B2A1C" font-family="system-ui">
        Etiqueta de apertura
    </text>
    <text x="220" y="120" text-anchor="middle" font-size="11" fill="#1B2A1C" font-family="system-ui" font-style="italic">
        Inicia el elemento
    </text>

    <!-- ATRIBUTO -->
    <line x1="335" y1="200" x2="335" y2="160" stroke="#D4A017" stroke-width="2"/>
    <line x1="335" y1="160" x2="430" y2="160" stroke="#D4A017" stroke-width="2"/>
    <rect x="360" y="100" width="180" height="50" fill="#D4A017" rx="4"/>
    <text x="450" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#1B2A1C" font-family="system-ui">
        Atributo
    </text>
    <text x="450" y="140" text-anchor="middle" font-size="11" fill="#1B2A1C" font-family="system-ui" font-style="italic">
        Configuración / dato extra
    </text>

    <!-- VALOR -->
    <line x1="490" y1="200" x2="490" y2="170" stroke="#FF9E64" stroke-width="2"/>
    <rect x="580" y="100" width="220" height="50" fill="#FF9E64" rx="4"/>
    <line x1="580" y1="125" x2="490" y2="170" stroke="#FF9E64" stroke-width="2"/>
    <text x="690" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#1B2A1C" font-family="system-ui">
        Valor (entre comillas)
    </text>
    <text x="690" y="140" text-anchor="middle" font-size="11" fill="#1B2A1C" font-family="system-ui" font-style="italic">
        El dato concreto
    </text>

    <!-- CONTENIDO -->
    <line x1="680" y1="280" x2="680" y2="330" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="3,2"/>
    <rect x="560" y="330" width="240" height="50" fill="#fff" stroke="#444" stroke-width="2" rx="4"/>
    <text x="680" y="352" text-anchor="middle" font-size="14" font-weight="bold" fill="#1B2A1C" font-family="system-ui">
        Contenido del elemento
    </text>
    <text x="680" y="370" text-anchor="middle" font-size="11" fill="#444" font-family="system-ui" font-style="italic">
        Lo que el usuario ve
    </text>

    <!-- ETIQUETA DE CIERRE -->
    <line x1="800" y1="280" x2="800" y2="410" stroke="#97BC62" stroke-width="2"/>
    <rect x="700" y="410" width="200" height="50" fill="#97BC62" rx="4"/>
    <text x="800" y="432" text-anchor="middle" font-size="14" font-weight="bold" fill="#1B2A1C" font-family="system-ui">
        Etiqueta de cierre
    </text>
    <text x="800" y="450" text-anchor="middle" font-size="11" fill="#1B2A1C" font-family="system-ui" font-style="italic">
        Finaliza el elemento
    </text>

    <!-- Nota: elementos vacíos -->
    <rect x="60" y="410" width="450" height="50" fill="#fff" stroke="#B85042" stroke-width="2" rx="4"/>
    <text x="285" y="430" text-anchor="middle" font-size="11" font-weight="bold" fill="#8b3c32" font-family="system-ui">
        Algunos elementos NO tienen contenido ni cierre:
    </text>
    <text x="285" y="450" text-anchor="middle" font-size="13" font-family="Consolas" fill="#1E2D24">
        &lt;img src="logo.png" alt="Logo"&gt;  &lt;br&gt;  &lt;input&gt;  &lt;meta&gt;
    </text>
</svg>
